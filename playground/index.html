<!doctype html>
<html lang="de" data-f11-debug data-f11-consent>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRAME11 Webflow Kit playground</title>
    <script>
      (() => {
        window.dataLayer = window.dataLayer || [];

        function gtag() {
          window.dataLayer.push(arguments);
        }

        gtag('consent', 'default', {
          analytics_storage: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted',
          wait_for_update: 500,
        });
      })();
    </script>
    <script type="application/json" data-f11-consent-config>
      {
        "mode": "opt-in",
        "revision": 1,
        "guiOptions": {
          "consentModal": {
            "layout": "box",
            "position": "bottom right",
            "equalWeightButtons": true,
            "flipButtons": false
          },
          "preferencesModal": {
            "layout": "box",
            "position": "right",
            "equalWeightButtons": true
          }
        },
        "categories": {
          "necessary": {
            "enabled": true,
            "readOnly": true
          },
          "analytics": {},
          "marketing": {}
        },
        "language": {
          "default": "de",
          "translations": {
            "de": {
              "consentModal": {
                "title": "Cookie-Einstellungen",
                "description": "Wir verwenden Cookies. Sie entscheiden selbst, welche Kategorien Sie zulassen möchten.",
                "acceptAllBtn": "Alle akzeptieren",
                "acceptNecessaryBtn": "Nur notwendige",
                "showPreferencesBtn": "Einstellungen"
              },
              "preferencesModal": {
                "title": "Datenschutz & Cookies",
                "acceptAllBtn": "Alle akzeptieren",
                "acceptNecessaryBtn": "Nur notwendige Cookies",
                "savePreferencesBtn": "Auswahl speichern",
                "closeIconLabel": "Einstellungen schließen",
                "sections": [
                  {
                    "title": "Ihre Auswahl",
                    "description": "Sie können Ihre Auswahl jederzeit ändern."
                  },
                  {
                    "title": "Notwendige Cookies",
                    "description": "Diese Cookies sind für den Betrieb erforderlich.",
                    "linkedCategory": "necessary"
                  },
                  {
                    "title": "Statistik",
                    "description": "Diese Cookies helfen uns, die Nutzung der Website zu verstehen.",
                    "linkedCategory": "analytics"
                  },
                  {
                    "title": "Marketing",
                    "description": "Diese Cookies unterstützen relevante Inhalte und Angebote.",
                    "linkedCategory": "marketing"
                  }
                ]
              }
            }
          }
        }
      }
    </script>
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <main>
      <h1>FRAME11 Webflow Kit</h1>
      <form data-f11-form>
        <label for="playground-email">E-Mail-Adresse</label>
        <input
          id="playground-email"
          name="email"
          type="email"
          required
          data-f11-error-required="Bitte gib deine E-Mail-Adresse ein."
          data-f11-error-invalid="Bitte gib eine gültige E-Mail-Adresse ein."
        />
        <input type="submit" value="Native submit" data-f11-hidden />
        <a href="#" data-f11-submit>Formular absenden</a>
      </form>
      <section data-f11-multistep data-f11-progress-complete>
        <h2>Multi-step form</h2>
        <div style="height: 0.25rem; background: #ddd">
          <div data-f11-progress style="height: 100%; background: #222"></div>
        </div>
        <p data-f11-progress-text></p>
        <div data-f11-step-viewport>
          <form data-f11-form>
            <div data-f11-step>
              <label for="playground-company">Firma</label>
              <input id="playground-company" name="company" required />
              <div data-f11-step-error>Bitte überprüfe deine Eingabe.</div>
              <button type="button" data-f11-next>Weiter</button>
            </div>
            <div data-f11-step>
              <label for="playground-multistep-email">E-Mail-Adresse</label>
              <input
                id="playground-multistep-email"
                name="email"
                type="email"
                required
              />
              <button type="button" data-f11-back>Zurück</button>
              <button type="submit">Absenden</button>
            </div>
          </form>
        </div>
      </section>
      <button type="button" data-f11-consent-open>
        Cookie-Einstellungen öffnen
      </button>
    </main>
  </body>
</html>
